name: Release build

# Builds the exe from the tagged source on GitHub's runners, so every
# release binary can be traced back to a commit. Run it by hand to check
# the build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # one after the other, so only the first job creates the draft release
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            exe: QuickAudioRecorder
          - runner: windows-11-arm
            arch: arm64
            exe: QuickAudioRecorder-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-build.txt

      - name: Build native application-capture dependency
        shell: pwsh
        run: ./scripts/build_proctap.ps1 -Architecture ${{ matrix.arch }}

      - name: Test
        run: python -m pytest

      - name: Build
        # UPX-packed exes get flagged by antivirus scanners far more often (#10)
        run: python -m PyInstaller --noconsole --onefile --noupx --additional-hooks-dir packaging/hooks --name ${{ matrix.exe }} main.py

      - name: Verify executable architecture
        run: python scripts/check_pe_arch.py ${{ matrix.arch }} dist/${{ matrix.exe }}.exe

      - name: Retain build artifacts for manual validation
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe }}
          path: dist/${{ matrix.exe }}.exe

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/${{ matrix.exe }}.exe -Algorithm SHA256).Hash + "  ${{ matrix.exe }}.exe" | Out-File -Encoding ascii dist/${{ matrix.exe }}.exe.sha256

      - name: Upload to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --draft --title "QuickAudioRecorder ${{ github.ref_name }}" --notes ""
          gh release upload ${{ github.ref_name }} dist/${{ matrix.exe }}.exe dist/${{ matrix.exe }}.exe.sha256 --clobber
